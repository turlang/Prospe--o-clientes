<!--
  @fileoverview Página de redefinição de senha por token temporário.
  As regiões principais usam elementos semânticos e identificadores consumidos
  pelos controladores JavaScript documentados na pasta public/.
-->
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Redefinir senha — LeadHunter Pro</title>
  <link rel="stylesheet" href="/assets/dashboard/styles.css?v=25.7.0" />
  <link rel="stylesheet" href="/assets/auth/reset-password.css?v=25.7.0" />
</head>
<body>
  <main class="reset-shell">
    <section class="reset-card">
      <p class="tag dark">Segurança</p>
      <h1>Redefinir senha</h1>
      <p class="meta">Digite sua nova senha para recuperar o acesso.</p>

      <form id="resetForm">
        <label for="newPassword">Nova senha</label>
        <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" minlength="8" maxlength="128" required />
        <label for="confirmPassword">Confirmar senha</label>
        <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="128" required />
        <button type="submit">Salvar nova senha</button>
      </form>

      <div id="resetStatus" aria-live="polite"></div>
      <p><a href="/app">Voltar para o login</a></p>
    </section>
  </main>

  <script src="/assets/auth/reset-password.js?v=25.7.0"></script>
</body>
</html>
