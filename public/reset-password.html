<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Redefinir senha — LeadHunter Pro</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .reset-shell { width:min(560px, calc(100% - 28px)); margin:0 auto; padding:48px 0; }
    .reset-card { padding:24px; border-radius:24px; background:rgba(255,255,255,.95); box-shadow:var(--soft-shadow); }
    .reset-card h1 { margin-top:0; }
    .reset-card form { display:grid; gap:14px; }
  </style>
</head>
<body>
  <main class="reset-shell">
    <section class="reset-card">
      <p class="tag dark">Segurança</p>
      <h1>Redefinir senha</h1>
      <p class="meta">Digite sua nova senha para recuperar o acesso.</p>

      <form id="resetForm">
        <label for="newPassword">Nova senha</label>
        <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" minlength="6" required />
        <label for="confirmPassword">Confirmar senha</label>
        <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="6" required />
        <button type="submit">Salvar nova senha</button>
      </form>

      <div id="resetStatus" aria-live="polite"></div>
      <p><a href="/app">Voltar para o login</a></p>
    </section>
  </main>

  <script src="reset-password.js?v=v15"></script>
</body>
</html>
