services:
  database:
    image: postgres:17-alpine
    container_name: delivery-burger-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: burger_user
      POSTGRES_PASSWORD: burger_password
      POSTGRES_DB: burger_db
    ports:
      - "5432:5432"
    volumes:
      - burger_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U burger_user -d burger_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  burger_postgres_data:
