name: Fix topbar usage position

on:
  push:
    branches:
      - fix/topbar-usage-under-plan-v27
    paths:
      - .release/topbar-usage/READY

permissions:
  contents: write

concurrency:
  group: fix-topbar-usage-position
  cancel-in-progress: false

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/topbar-usage-under-plan-v27
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Move usage text directly below plan
        shell: python
        run: |
          from pathlib import Path

          css_path = Path('public/assets/dashboard/css/95-top-navigation.css')
          css = css_path.read_text(encoding='utf-8')

          replacements = {
              '''  justify-self: end;\n  align-self: end;\n  width: 184px;\n  margin: 0 126px 10px 0;''': '''  justify-self: end;\n  align-self: start;\n  width: 220px;\n  margin: 35px 126px 0 0;''',
              '''  display: flex;\n  flex-direction: column;\n  align-items: flex-end;\n  gap: 1px;''': '''  display: flex;\n  flex-direction: row;\n  align-items: baseline;\n  justify-content: flex-end;\n  gap: 3px;''',
              '''  text-align: right;\n  text-overflow: clip;\n}''': '''  text-align: right;\n  text-overflow: clip;\n  white-space: nowrap;\n}''',
              '''  body.is-authenticated .sidebar-account {\n    width: 174px;\n    margin-right: 114px;\n  }''': '''  body.is-authenticated .sidebar-account {\n    width: 205px;\n    margin: 35px 114px 0 0;\n  }''',
              '''  body.is-authenticated .sidebar-account {\n    width: 174px;\n    margin: 0 114px 62px 0;\n  }''': '''  body.is-authenticated .sidebar-account {\n    width: 205px;\n    margin: 35px 114px 0 0;\n  }''',
              '''  body.is-authenticated .sidebar-account {\n    width: min(210px, calc(100% - 24px));\n    margin: 0 12px 62px 0;\n    padding-right: 0;\n  }''': '''  body.is-authenticated .sidebar-account {\n    width: min(220px, calc(100% - 24px));\n    margin: 84px 12px 0 0;\n    padding-right: 0;\n  }'''
          }

          for before, after in replacements.items():
              if before not in css:
                  raise SystemExit(f'Expected CSS block not found:\n{before}')
              css = css.replace(before, after, 1)

          marker = '''body.is-authenticated .sidebar-account__content .usage-box strong,\nbody.is-authenticated .sidebar-account__content .usage-box b {'''
          if marker not in css:
              raise SystemExit('Usage label rule not found')
          css = css.replace(marker, '''body.is-authenticated .sidebar-account__content .usage-box strong::after,\nbody.is-authenticated .sidebar-account__content .usage-box b::after {\n  content: ':';\n}\n\nbody.is-authenticated .sidebar-account__content .usage-box strong,\nbody.is-authenticated .sidebar-account__content .usage-box b {''', 1)

          css_path.write_text(css, encoding='utf-8')

          styles_path = Path('public/assets/dashboard/styles.css')
          styles = styles_path.read_text(encoding='utf-8')
          if '95-top-navigation.css?v=27.0.4' not in styles:
              raise SystemExit('Expected CSS cache version not found')
          styles = styles.replace('95-top-navigation.css?v=27.0.4', '95-top-navigation.css?v=27.0.5')
          styles_path.write_text(styles, encoding='utf-8')

          test_path = Path('tests/topNavigationLayout.test.js')
          test = test_path.read_text(encoding='utf-8')
          test = test.replace('95-top-navigation\\.css\\?v=27\\.0\\.4', '95-top-navigation\\.css\\?v=27\\.0\\.5')
          test = test.replace("assert.match(accountRule, /align-self:\\s*end/);", "assert.match(accountRule, /align-self:\\s*start/);")
          test = test.replace("assert.match(accountRule, /margin:\\s*0 126px 10px 0/);", "assert.match(accountRule, /margin:\\s*35px 126px 0 0/);")
          test = test.replace("assert.match(usageRule, /text-align:\\s*right/);", "assert.match(usageRule, /text-align:\\s*right/);\n  assert.match(usageRule, /flex-direction:\\s*row/);\n  assert.match(usageRule, /white-space:\\s*nowrap/);")
          test_path.write_text(test, encoding='utf-8')

      - name: Validate
        run: |
          npm ci
          npm run quality

      - name: Commit validated fix
        shell: bash
        run: |
          rm -rf .release/topbar-usage .github/workflows/fix-topbar-usage-position.yml
          git config user.name "LeadHunter Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: posicionar uso diário diretamente abaixo do plano"
          git push origin HEAD:fix/topbar-usage-under-plan-v27
