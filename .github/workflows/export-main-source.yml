name: Export Main Source

on:
  push:
    branches:
      - integration/crm360-clean-v27
    paths:
      - .release/export-main/READY
  pull_request:
    branches:
      - main
    paths:
      - .release/export-main/READY

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/crm360-clean-v27
          fetch-depth: 0

      - name: Package current source
        shell: bash
        run: |
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=.release \
            --exclude=.github/workflows/export-main-source.yml \
            -czf /tmp/leadhunter-main-source.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: leadhunter-main-source
          path: /tmp/leadhunter-main-source.tar.gz
          if-no-files-found: error
          retention-days: 1
