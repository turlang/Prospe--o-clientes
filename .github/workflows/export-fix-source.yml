name: Export Fix Source

on:
  push:
    branches:
      - fix/crm-financial-forecast-v27
    paths:
      - .release/export-fix/READY

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/crm-financial-forecast-v27
          fetch-depth: 0
      - name: Package source
        run: |
          tar --exclude=.git --exclude=node_modules --exclude=.release --exclude=.github/workflows/export-fix-source.yml -czf /tmp/source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: leadhunter-fix-source
          path: /tmp/source.tar.gz
          retention-days: 1
