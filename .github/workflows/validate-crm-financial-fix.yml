name: Validate CRM Financial Fix

on:
  pull_request:
    branches:
      - main
    paths:
      - .release/crm-financial-fix/READY
      - scripts/apply-crm-financial-fix.py
      - .github/workflows/validate-crm-financial-fix.yml

permissions:
  contents: write

concurrency:
  group: leadhunter-crm-financial-pr
  cancel-in-progress: false

jobs:
  validate-and-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Apply correction
        run: python scripts/apply-crm-financial-fix.py

      - name: Install and validate
        run: |
          npm ci
          node --test tests/crmAdvancedService.test.js tests/crmMilestone2Frontend.test.js
          npm run quality

      - name: Publish validated branch
        shell: bash
        run: |
          rm -rf .release/export-fix .release/crm-financial-fix
          rm -f scripts/apply-crm-financial-fix.py
          rm -f .github/workflows/export-fix-source.yml
          rm -f .github/workflows/apply-crm-financial-fix.yml
          rm -f .github/workflows/validate-crm-financial-fix.yml
          git config user.name "LeadHunter Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: corrigir previsão financeira e layout da lista CRM"
          git push origin HEAD:${{ github.head_ref }}
