name: Apply CRM Financial Fix

on:
  push:
    branches:
      - fix/crm-financial-forecast-v27
    paths:
      - .release/crm-financial-fix/READY

permissions:
  contents: write

concurrency:
  group: leadhunter-crm-financial-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/crm-financial-forecast-v27
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Correct monetary ranges and CRM list layout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          service = Path('src/services/crmAdvancedService.js')
          text = service.read_text()
          old = '''function normalizeMoney(value) {
            if (typeof value === 'number') return Number.isFinite(value) ? Math.max(0, value) : 0;
            const text = String(value || '').trim();
            if (!text) return 0;
            const normalized = text
              .replace(/R\$/gi, '')
              .replace(/\s+/g, '')
              .replace(/\.(?=\d{3}(?:\D|$))/g, '')
              .replace(',', '.');
            const number = Number(normalized.replace(/[^0-9.-]/g, ''));
            return Number.isFinite(number) ? Math.max(0, number) : 0;
          }
          '''
          new = '''function parseMoneyToken(value) {
            let text = String(value || '').trim().replace(/[^0-9.,]/g, '');
            if (!text) return 0;

            const lastComma = text.lastIndexOf(',');
            const lastDot = text.lastIndexOf('.');

            if (lastComma >= 0 && lastDot >= 0) {
              if (lastComma > lastDot) text = text.replace(/\./g, '').replace(',', '.');
              else text = text.replace(/,/g, '');
            } else if (lastComma >= 0) {
              const decimalDigits = text.length - lastComma - 1;
              text = decimalDigits > 0 && decimalDigits <= 2
                ? text.replace(/\./g, '').replace(',', '.')
                : text.replace(/,/g, '');
            } else if (lastDot >= 0) {
              const dotCount = (text.match(/\./g) || []).length;
              const decimalDigits = text.length - lastDot - 1;
              if (dotCount > 1 || decimalDigits === 3) text = text.replace(/\./g, '');
            }

            const number = Number(text);
            return Number.isFinite(number) ? Math.max(0, number) : 0;
          }

          function normalizeMoney(value) {
            if (typeof value === 'number') return Number.isFinite(value) ? Math.max(0, value) : 0;
            const text = String(value || '').trim();
            if (!text) return 0;

            const tokens = text.match(/\d[\d.,]*/g) || [];
            const amounts = tokens.map(parseMoneyToken).filter((amount) => Number.isFinite(amount) && amount >= 0);
            if (!amounts.length) return 0;

            const isRange = amounts.length >= 2 && /(?:\bentre\b.*\be\b|\b(?:a|até|ate)\b|[-–—])/i.test(text);
            if (isRange) return Math.round(((amounts[0] + amounts[1]) / 2) * 100) / 100;

            return amounts[0];
          }
          '''
          if old not in text:
              raise SystemExit('normalizeMoney block not found')
          service.write_text(text.replace(old, new))

          app = Path('public/assets/dashboard/app.js')
          text = app.read_text()
          old = "function estimateTicket(value) { const text = String(value || '0').replace(/\\./g, '').replace(',', '.'); const match = text.match(/\\d+(?:\\.\\d+)?/); return match ? Number(match[0]) : 0; }"
          new = '''function parseUiMoneyToken(value) {
            let text = String(value || '').trim().replace(/[^0-9.,]/g, '');
            if (!text) return 0;
            const lastComma = text.lastIndexOf(',');
            const lastDot = text.lastIndexOf('.');
            if (lastComma >= 0 && lastDot >= 0) {
              text = lastComma > lastDot ? text.replace(/\./g, '').replace(',', '.') : text.replace(/,/g, '');
            } else if (lastComma >= 0) {
              const decimals = text.length - lastComma - 1;
              text = decimals > 0 && decimals <= 2 ? text.replace(/\./g, '').replace(',', '.') : text.replace(/,/g, '');
            } else if (lastDot >= 0) {
              const dots = (text.match(/\./g) || []).length;
              if (dots > 1 || text.length - lastDot - 1 === 3) text = text.replace(/\./g, '');
            }
            const number = Number(text);
            return Number.isFinite(number) ? Math.max(0, number) : 0;
          }
          function estimateTicket(value) {
            if (typeof value === 'number') return Number.isFinite(value) ? Math.max(0, value) : 0;
            const text = String(value || '').trim();
            const amounts = (text.match(/\d[\d.,]*/g) || []).map(parseUiMoneyToken).filter(Number.isFinite);
            if (!amounts.length) return 0;
            const isRange = amounts.length >= 2 && /(?:\bentre\b.*\be\b|\b(?:a|até|ate)\b|[-–—])/i.test(text);
            return isRange ? (amounts[0] + amounts[1]) / 2 : amounts[0];
          }'''
          if old not in text:
              raise SystemExit('estimateTicket block not found')
          text = text.replace(old, new)
          text = text.replace("${formatMoney(Number(lead.contractValue || lead.ticketEstimado || 0))}", "${formatMoney(estimateTicket(lead.contractValue || lead.ticketEstimado || 0))}")
          text = text.replace("${formatMoney(Number(lead.monthlyRecurringRevenue || 0))}/mês", "${formatMoney(estimateTicket(lead.monthlyRecurringRevenue || 0))}/mês")
          text = text.replace('class="secondary mini" onclick="openLeadDetail', 'class="secondary mini crm-open-button" onclick="openLeadDetail')
          app.write_text(text)

          css = Path('public/assets/dashboard/css/40-views.css')
          text = css.read_text()
          needle = '.crm-table td small { color: var(--text-muted); }\n'
          addition = '''.crm-table td small { color: var(--text-muted); }
          .crm-table th:nth-child(4),
          .crm-table td:nth-child(4) { min-width: 220px; }
          .crm-table th:last-child,
          .crm-table td:last-child { width: 86px; min-width: 86px; text-align: center; }
          .crm-open-button { min-width: 68px; white-space: nowrap; word-break: normal; }
          '''
          if needle not in text:
              raise SystemExit('CSS insertion point not found')
          css.write_text(text.replace(needle, addition))

          tests = Path('tests/crmAdvancedService.test.js')
          text = tests.read_text()
          anchor = "test('previsão inclui receita ponderada, MRR e progresso de metas', () => {\n"
          addition = '''test('faixas monetárias usam o ponto médio sem concatenar os extremos', () => {
            const config = createDefaultCrmConfiguration();
            const forecast = buildForecast([
              { status: 'NOVO', pipelineId: 'sales', ticketEstimado: 'R$ 3.000 a R$ 15.000' },
              { status: 'CONTATADO', pipelineId: 'sales', ticketEstimado: 'R$ 800 a R$ 5.000' }
            ], config, new Date('2026-08-15T12:00:00.000Z'));

            assert.equal(forecast.pipelineRevenue, 11900);
            assert.equal(forecast.weightedRevenue, 1184);
          });

          '''
          if addition not in text:
              text = text.replace(anchor, addition + anchor)
          tests.write_text(text)

          tests = Path('tests/crmMilestone2Frontend.test.js')
          text = tests.read_text()
          addition = '''

          test('lista do CRM trata faixas monetárias e preserva o botão de ação', () => {
            assert.match(js, /function estimateTicket/);
            assert.match(js, /isRange/);
            assert.match(js, /crm-open-button/);
            assert.match(css, /\.crm-open-button/);
          });
          '''
          if 'lista do CRM trata faixas monetárias' not in text:
              text += addition
          tests.write_text(text)
          PY

      - name: Install and validate
        run: |
          npm ci
          node --test tests/crmAdvancedService.test.js tests/crmMilestone2Frontend.test.js
          npm run quality

      - name: Commit validated correction
        shell: bash
        run: |
          rm -rf .release/export-fix .release/crm-financial-fix
          rm -f .github/workflows/export-fix-source.yml .github/workflows/apply-crm-financial-fix.yml
          git config user.name "LeadHunter Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: corrigir previsão financeira e layout da lista CRM"
          git push origin HEAD:fix/crm-financial-forecast-v27
