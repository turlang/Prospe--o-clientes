name: Apply Q7 Omnichannel Phase 2

on:
  push:
    branches:
      - feature/q7-omnichannel-sdr
    paths:
      - .release/q7-phase2/READY

permissions:
  contents: write

concurrency:
  group: q7-omnichannel-phase2
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/q7-omnichannel-sdr
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Rebuild authenticated inbox interface
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib

          chunks = sorted(Path('.release/q7-phase2').glob('ui-chunk-*.b64'))
          if len(chunks) != 5:
              raise SystemExit(f'Expected 5 UI chunks, found {len(chunks)}')

          encoded = ''.join(path.read_text(encoding='utf-8-sig') for path in chunks)
          encoded = ''.join(encoded.split())
          content = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(content).hexdigest()
          expected = 'afc07ca93ae7514ec09156a9925723bb460133e42c4130bc97dac12623c07c79'
          if digest != expected:
              raise SystemExit(f'Invalid UI checksum: {digest}')

          target = Path('public/assets/dashboard/omnichannel.js')
          target.write_bytes(content)
          print(f'Rebuilt {target} ({len(content)} bytes, sha256={digest})')

          page = Path('public/pages/app.html')
          html = page.read_text(encoding='utf-8')
          script = '<script src="/assets/dashboard/omnichannel.js?v=26.2.0"></script>'
          anchor = '<script src="/assets/dashboard/app.js?v=26.2.0"></script>'
          if script not in html:
              if anchor not in html:
                  raise SystemExit('Dashboard script anchor not found')
              html = html.replace(anchor, f'{anchor}\n  {script}', 1)
              page.write_text(html, encoding='utf-8')
          PY

          rm -rf .release/q7-phase2 .github/workflows/apply-q7-phase2.yml

      - name: Install dependencies
        run: npm ci

      - name: Validate Central de Conversas
        run: |
          node --check public/assets/dashboard/omnichannel.js
          node --test tests/omnichannel-conversations.test.js
          npm run quality

      - name: Commit validated phase
        shell: bash
        run: |
          git config user.name "LeadHunter Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: central de conversas omnichannel"
          git push origin HEAD:feature/q7-omnichannel-sdr
