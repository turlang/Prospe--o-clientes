name: Validate Q7 Omnichannel Phase 2 Security

on:
  push:
    branches:
      - feature/q7-omnichannel-sdr
    paths:
      - .release/q7-phase2-security/READY

permissions:
  contents: write

concurrency:
  group: q7-omnichannel-phase2-security
  cancel-in-progress: false

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/q7-omnichannel-sdr
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate security and regression suite
        run: |
          node --test tests/omnichannel-security.test.js
          node --test tests/omnichannel-conversations.test.js
          npm run quality

      - name: Commit validated state
        shell: bash
        run: |
          rm -rf .release/q7-phase2-security .github/workflows/validate-q7-phase2-security.yml
          git config user.name "LeadHunter Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "test: validate omnichannel ownership boundaries"
          git push origin HEAD:feature/q7-omnichannel-sdr
