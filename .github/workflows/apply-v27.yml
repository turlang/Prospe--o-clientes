name: Apply LeadHunter v27

on:
  push:
    branches:
      - agent/release-v27-crm360
    paths:
      - .release/v27/READY
  pull_request:
    branches:
      - main
    paths:
      - .release/v27/READY

permissions:
  contents: write

concurrency:
  group: leadhunter-v27-crm360
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Rebuild release delta
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import io
          import re
          import tarfile

          release_dir = Path('.release/v27')

          def read(name):
              text = (release_dir / name).read_text(encoding='utf-8-sig')
              return ''.join(text.replace('\ufeff', '').split())

          canonical_names = [f'chunk-{index:03d}.b64' for index in range(13)]
          split_names = ['chunk-000.b64', 'chunk-001.b64', 'chunk-002a.b64', 'chunk-002b.b64', 'chunk-002c.b64'] + [f'chunk-{index:03d}.b64' for index in range(3, 13)]

          for name in sorted(path.name for path in release_dir.glob('chunk-*.b64')):
              text = read(name)
              equals = [index for index, char in enumerate(text) if char == '=']
              print(name, 'chars=', len(text), 'mod4=', len(text) % 4, 'padding=', len(equals), 'padding_positions=', equals[:8])

          print('chunk002_equals_parts=', read('chunk-002.b64') == ''.join(read(name) for name in ['chunk-002a.b64', 'chunk-002b.b64', 'chunk-002c.b64']))

          def decode_join(names, remove_padding=False):
              text = ''.join(read(name) for name in names)
              if remove_padding:
                  text = text.replace('=', '')
              text += '=' * ((4 - len(text) % 4) % 4)
              return base64.b64decode(text, validate=False)

          def decode_parts(names):
              output = bytearray()
              for name in names:
                  text = read(name)
                  text += '=' * ((4 - len(text) % 4) % 4)
                  output.extend(base64.b64decode(text, validate=False))
              return bytes(output)

          candidates = []
          strategies = [
              ('canonical_join', lambda: decode_join(canonical_names, False)),
              ('canonical_without_internal_padding', lambda: decode_join(canonical_names, True)),
              ('split_join', lambda: decode_join(split_names, False)),
              ('split_without_internal_padding', lambda: decode_join(split_names, True)),
              ('canonical_decoded_per_file', lambda: decode_parts(canonical_names)),
              ('split_decoded_per_file', lambda: decode_parts(split_names))
          ]

          for label, factory in strategies:
              try:
                  payload = factory()
                  print(label, 'bytes=', len(payload), 'sha256=', hashlib.sha256(payload).hexdigest(), 'magic=', payload[:4].hex())
                  with tarfile.open(fileobj=io.BytesIO(payload), mode='r:gz') as package:
                      members = package.getmembers()
                  if members:
                      candidates.append((label, payload, len(members)))
                      print(label, 'VALID_TAR members=', len(members))
              except Exception as error:
                  print(label, 'FAILED', type(error).__name__, str(error))

          if not candidates:
              raise SystemExit('Nenhuma estratégia reconstruiu um tar.gz válido.')

          label, archive, member_count = candidates[0]
          output = Path('/tmp/leadhunter-v27-delta.tar.gz')
          output.write_bytes(archive)
          print('selected=', label, 'members=', member_count, 'archive=', len(archive), hashlib.sha256(archive).hexdigest())
          PY
          tar -xzf /tmp/leadhunter-v27-delta.tar.gz
          rm -rf .release .github/workflows/apply-v27.yml

      - name: Validate
        run: |
          npm ci
          npm run quality

      - name: Commit release
        shell: bash
        run: |
          git config user.name "LeadHunter Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: release 27.0.0 com Marco 2 CRM 360"
          git push origin HEAD:agent/release-v27-crm360
