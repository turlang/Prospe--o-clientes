name: Apply LeadHunter v27

on:
  push:
    branches:
      - agent/release-v27-crm360
    paths:
      - .release/v27/READY

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Rebuild release delta
        shell: bash
        run: |
          cat .release/v27/chunk-*.b64 | base64 --decode > /tmp/leadhunter-v27-delta.tar.gz
          tar -xzf /tmp/leadhunter-v27-delta.tar.gz
          rm -rf .release .github/workflows/apply-v27.yml

      - name: Validate
        run: |
          npm ci
          npm run quality

      - name: Commit release
        shell: bash
        run: |
          git config user.name "LeadHunter Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: release 27.0.0 com Marco 2 CRM 360"
          git push origin HEAD:agent/release-v27-crm360
