name: Apply LeadHunter v27

on:
  push:
    branches:
      - agent/release-v27-crm360
    paths:
      - .release/v27/READY
  pull_request:
    branches:
      - main
    paths:
      - .release/v27/READY

permissions:
  contents: write

concurrency:
  group: leadhunter-v27-crm360
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Rebuild release delta
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import re

          release_dir = Path('.release/v27')
          chunks = sorted(
              path for path in release_dir.glob('chunk-*.b64')
              if re.fullmatch(r'chunk-\d{3}\.b64', path.name)
          )
          if len(chunks) != 13:
              raise SystemExit(f'Expected 13 canonical chunks, found {len(chunks)}')

          for path in chunks:
              raw = path.read_bytes()
              print(path.name, len(raw), hashlib.sha256(raw).hexdigest())

          encoded = ''.join(path.read_text(encoding='utf-8-sig') for path in chunks)
          encoded = ''.join(encoded.split())
          archive = base64.b64decode(encoded, validate=True)
          output = Path('/tmp/leadhunter-v27-delta.tar.gz')
          output.write_bytes(archive)
          print('archive', len(archive), hashlib.sha256(archive).hexdigest())
          PY
          tar -tzf /tmp/leadhunter-v27-delta.tar.gz >/dev/null
          tar -xzf /tmp/leadhunter-v27-delta.tar.gz
          rm -rf .release .github/workflows/apply-v27.yml

      - name: Validate
        run: |
          npm ci
          npm run quality

      - name: Commit release
        shell: bash
        run: |
          git config user.name "LeadHunter Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: release 27.0.0 com Marco 2 CRM 360"
          git push origin HEAD:agent/release-v27-crm360
