<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Preview real do LeadHunter Pro</title><desc id="desc">Captura fiel da landing e do painel de visão executiva.</desc><rect width="1600" height="900" fill="#f3f6fa"/><defs><linearGradient id="lh" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset=".55" stop-color="#0f2743"/><stop offset="1" stop-color="#07101c"/></linearGradient><linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2f80ff"/><stop offset="1" stop-color="#27d6a1"/></linearGradient></defs><g font-family="Arial,Helvetica,sans-serif"><rect width="1600" height="900" fill="#f3f6fa"/><rect width="1600" height="78" fill="#07111f"/><text x="70" y="49" fill="#fff" font-size="25" font-weight="800">LeadHunter <tspan fill="#4ab3ff">Pro</tspan></text><g fill="#d6e3ef" font-size="15"><text x="820" y="47">Como funciona</text><text x="945" y="47">Recursos</text><text x="1030" y="47">Planos</text><text x="1100" y="47">FAQ</text></g><rect x="1210" y="19" width="115" height="40" rx="20" fill="none" stroke="#4ab3ff"/><text x="1242" y="45" fill="#fff" font-size="14">Entrar</text><rect x="1340" y="19" width="185" height="40" rx="20" fill="url(#blue)"/><text x="1370" y="45" fill="#061421" font-size="14" font-weight="800">Começar gratuitamente</text><rect y="78" width="1600" height="510" fill="url(#lh)"/><circle cx="1320" cy="170" r="280" fill="#2f80ff" opacity=".09"/><text x="95" y="170" fill="#6ec9ff" font-size="16" font-weight="700">PROSPECÇÃO COMERCIAL INTELIGENTE</text><text x="95" y="245" fill="#fff" font-size="62" font-weight="850">Encontre empresas.</text><text x="95" y="315" fill="#fff" font-size="62" font-weight="850">Descubra oportunidades.</text><text x="95" y="385" fill="#38d6a2" font-size="62" font-weight="850">Venda com método.</text><text x="100" y="435" fill="#c6d6e4" font-size="21">Auditoria digital, score de oportunidade, CRM 360 e agente SDR</text><text x="100" y="468" fill="#c6d6e4" font-size="21">em uma única plataforma para freelancers, devs e agências.</text><rect x="95" y="510" width="245" height="56" rx="28" fill="url(#blue)"/><text x="135" y="545" fill="#061421" font-size="17" font-weight="800">BUSCAR PRIMEIROS LEADS</text><g transform="translate(900 130)"><rect width="610" height="395" rx="24" fill="#fff" stroke="#dce5ed"/><rect width="610" height="58" rx="24" fill="#0b1d31"/><text x="25" y="37" fill="#fff" font-size="17" font-weight="700">Visão executiva</text><rect x="25" y="82" width="170" height="82" rx="14" fill="#f7f9fc"/><text x="42" y="112" fill="#718293" font-size="13">Leads ativos</text><text x="42" y="145" fill="#0b2741" font-size="28" font-weight="800">148</text><rect x="220" y="82" width="170" height="82" rx="14" fill="#f7f9fc"/><text x="237" y="112" fill="#718293" font-size="13">Pipeline</text><text x="237" y="145" fill="#0b2741" font-size="24" font-weight="800">R$ 92.600</text><rect x="415" y="82" width="170" height="82" rx="14" fill="#f7f9fc"/><text x="432" y="112" fill="#718293" font-size="13">Conversão</text><text x="432" y="145" fill="#0b2741" font-size="28" font-weight="800">24,8%</text><text x="28" y="207" fill="#0b2741" font-size="17" font-weight="700">Funil comercial</text><g transform="translate(28 230)"><rect width="350" height="36" rx="8" fill="#2f80ff"/><rect y="48" width="280" height="36" rx="8" fill="#3598d8"/><rect y="96" width="205" height="36" rx="8" fill="#2dbfae"/><rect y="144" width="130" height="36" rx="8" fill="#27d6a1"/></g><rect x="410" y="205" width="175" height="165" rx="16" fill="#0b2741"/><text x="432" y="238" fill="#82cfff" font-size="16" font-weight="700">Plano de ação</text><text x="432" y="275" fill="#dbe9f3" font-size="14">12 leads sem avanço</text><text x="432" y="302" fill="#dbe9f3" font-size="14">5 follow-ups hoje</text><rect x="432" y="328" width="130" height="30" rx="15" fill="#27d6a1"/><text x="452" y="348" fill="#062018" font-size="12" font-weight="800">PRIORIZAR</text></g><rect y="588" width="1600" height="312" fill="#fff"/><text x="800" y="650" text-anchor="middle" fill="#2f80ff" font-size="15" font-weight="700">DO PRIMEIRO SINAL AO FECHAMENTO</text><text x="800" y="695" text-anchor="middle" fill="#0b2741" font-size="36" font-weight="800">Um sistema operacional comercial completo</text><g transform="translate(95 735)"><rect width="320" height="125" rx="16" fill="#f4f7fb"/><text x="25" y="38" fill="#0b2741" font-size="20" font-weight="700">Prospecção</text><text x="25" y="70" fill="#607386" font-size="15">Encontre empresas e audite presença digital.</text><rect x="350" width="320" height="125" rx="16" fill="#f4f7fb"/><text x="375" y="38" fill="#0b2741" font-size="20" font-weight="700">CRM 360</text><text x="375" y="70" fill="#607386" font-size="15">Pipeline, tarefas, propostas e clientes.</text><rect x="700" width="320" height="125" rx="16" fill="#f4f7fb"/><text x="725" y="38" fill="#0b2741" font-size="20" font-weight="700">Inteligência comercial</text><text x="725" y="70" fill="#607386" font-size="15">Plano de ação e copiloto com contexto.</text><rect x="1050" width="320" height="125" rx="16" fill="#f4f7fb"/><text x="1075" y="38" fill="#0b2741" font-size="20" font-weight="700">Conversas</text><text x="1075" y="70" fill="#607386" font-size="15">Inbox vinculada ao CRM e agente SDR.</text></g></g></svg>